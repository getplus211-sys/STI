<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CBRT Credit</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    :root {
      --blue: #1b4f8c;
      --blue-dark: #123b6d;
      --bg: #eef3f8;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --border: #d9e1ea;
      --danger: #d92d20;
      --success: #16803c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(27, 79, 140, 0.14), transparent 32rem),
        linear-gradient(135deg, #f8fbff 0%, var(--bg) 100%);
    }

    .page {
      width: min(100%, 480px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 18px;
      display: grid;
      align-items: center;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 26px;
      box-shadow: 0 18px 45px rgba(16, 24, 40, 0.12);
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: rgba(27, 79, 140, 0.1);
      color: var(--blue);
      font-size: 30px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      color: var(--blue);
    }

    .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 13px;
      font-weight: 700;
      color: #344054;
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 13px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(27, 79, 140, 0.12);
    }

    button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 8px;
      margin-top: 16px;
      background: var(--blue);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .ghost {
      background: transparent;
      color: var(--blue);
      border: 1px solid var(--border);
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 18px 0 8px;
    }

    .chip {
      margin: 0;
      background: #f6f9fc;
      color: var(--blue-dark);
      border: 1px solid var(--border);
    }

    .balance {
      text-align: center;
      padding: 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fbff;
      margin-bottom: 18px;
    }

    .balance .label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .balance .value {
      margin-top: 4px;
      color: var(--blue);
      font-size: 46px;
      font-weight: 900;
    }

    .offer {
      margin: 0 0 16px;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #abefc6;
      background: #ecfdf3;
      color: var(--success);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }

    .preview {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f8fbff;
      color: var(--blue-dark);
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    .center {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .error {
      color: var(--danger);
      background: #fff1f0;
      border: 1px solid #ffd0cc;
    }

    .success {
      color: var(--success);
      background: #ecfdf3;
      border: 1px solid #abefc6;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="brand">
        <div class="logo">₹</div>
        <h1>CBRT Credit</h1>
        <div class="sub">Login and buy credits for your computer exam center</div>
      </div>

      <div id="loginView">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="operator@example.com">

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Password">

        <button id="loginBtn">LOGIN</button>
      </div>

      <div id="homeView" class="hidden">
        <div class="center" id="operatorName"></div>

        <div class="balance">
          <div class="label">Available Credits</div>
          <div class="value" id="creditBalance">0</div>
        </div>

        <div class="offer">Offer: Every ₹500 gives 100 credits free</div>

        <div class="chips">
          <button class="chip" data-amount="100">₹100</button>
          <button class="chip" data-amount="500">₹500</button>
          <button class="chip" data-amount="1000">₹1000</button>
          <button class="chip" data-amount="2000">₹2000</button>
        </div>

        <label for="amount">Amount</label>
        <input id="amount" type="number" min="1" step="1" value="500">

        <div class="preview" id="creditPreview">Pay ₹500 and get 600 credits</div>

        <button id="buyBtn">BUY CREDITS</button>
        <button id="refreshBtn" class="ghost">REFRESH BALANCE</button>
        <button id="logoutBtn" class="ghost">LOGOUT</button>
      </div>

      <div id="msg" class="message hidden"></div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://arlvoarkbtteywpobkmb.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFybHZvYXJrYnR0ZXl3cG9ia21iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyOTkxNjYsImV4cCI6MjEwMzg3NTE2Nn0.zzf_TEW6VCOy-Rvdk_JTmWomeSkzaaahcIRl8B-o1Do";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let session = null;
    let operator = null;

    const loginView = document.getElementById("loginView");
    const homeView = document.getElementById("homeView");
    const msg = document.getElementById("msg");
    const loginBtn = document.getElementById("loginBtn");
    const buyBtn = document.getElementById("buyBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const amountInput = document.getElementById("amount");
    const creditPreview = document.getElementById("creditPreview");

    function calculateCredits(amount) {
      const baseCredits = Math.round(Number(amount) || 0);
      const freeCredits = Math.floor(baseCredits / 500) * 100;
      return {
        baseCredits,
        freeCredits,
        totalCredits: baseCredits + freeCredits,
      };
    }

    function updateCreditPreview() {
      const amount = Number(amountInput.value);
      const credits = calculateCredits(amount);

      if (!Number.isFinite(amount) || amount <= 0) {
        creditPreview.textContent = "Enter amount to see credits";
        return;
      }

      creditPreview.textContent = credits.freeCredits > 0
        ? `Pay ₹${credits.baseCredits} and get ${credits.totalCredits} credits (${credits.freeCredits} free)`
        : `Pay ₹${credits.baseCredits} and get ${credits.totalCredits} credits`;
    }

    function showMessage(text, type) {
      msg.textContent = text;
      msg.className = `message ${type}`;
      msg.classList.remove("hidden");
    }

    function clearMessage() {
      msg.textContent = "";
      msg.className = "message hidden";
    }

    function setBusy(isBusy) {
      loginBtn.disabled = isBusy;
      buyBtn.disabled = isBusy;
      refreshBtn.disabled = isBusy;
    }

    function showHome() {
      loginView.classList.add("hidden");
      homeView.classList.remove("hidden");
      document.getElementById("operatorName").textContent = operator.center_name || operator.email || "";
      document.getElementById("creditBalance").textContent = operator.credit_balance ?? 0;
      updateCreditPreview();
    }

    async function loadOperator() {
      const userId = session?.user?.id;
      if (!userId) throw new Error("Login session not found");

      const { data, error } = await client
        .from("cbrt_operators")
        .select("*")
        .eq("id", userId)
        .single();

      if (error) throw error;

      operator = data;
      showHome();
    }

    async function login() {
      clearMessage();
      setBusy(true);

      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        const { data, error } = await client.auth.signInWithPassword({
          email,
          password,
        });

        if (error) throw error;

        session = data.session;
        await loadOperator();
      } catch (err) {
        showMessage(`Login failed: ${err.message || err}`, "error");
      } finally {
        setBusy(false);
      }
    }

    async function refreshBalance() {
      clearMessage();
      setBusy(true);

      try {
        await loadOperator();
        showMessage("Balance refreshed.", "success");
      } catch (err) {
        showMessage(`Could not refresh balance: ${err.message || err}`, "error");
      } finally {
        setBusy(false);
      }
    }

    async function buyCredits() {
      clearMessage();
      setBusy(true);

      try {
        const amount = Number(amountInput.value);

        if (!Number.isFinite(amount) || amount <= 0) {
          throw new Error("Enter a valid amount");
        }

        const { data: currentSession } = await client.auth.getSession();
        session = currentSession.session;

        if (!session?.access_token) {
          throw new Error("Please login again");
        }

        const res = await fetch(`${SUPABASE_URL}/functions/v1/create-razorpay-order`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${session.access_token}`,
            "apikey": SUPABASE_ANON_KEY,
          },
          body: JSON.stringify({
            operator_id: operator.id,
            amount_rupees: amount,
            payment_method: "checkout",
          }),
        });

        const order = await res.json();

        if (!res.ok || order.error) {
          throw new Error(JSON.stringify(order));
        }

        const credits = calculateCredits(amount);

        const checkout = new Razorpay({
          key: order.key_id,
          amount: order.amount,
          currency: order.currency || "INR",
          name: "CBRT Credit",
          description: `${credits.totalCredits} credits recharge`,
          order_id: order.order_id,
          prefill: {
            email: operator.email || "",
          },
          notes: {
            operator_id: operator.id,
            amount_rupees: String(amount),
            base_credits: String(credits.baseCredits),
            free_credits: String(credits.freeCredits),
            total_credits: String(credits.totalCredits),
            reference_id: order.reference_id || "",
            source: "cbrt_credit_website",
          },
          theme: {
            color: "#1B4F8C",
          },
          handler: async function (response) {
            showMessage(
              `Payment successful. Updating credits...\nPayment ID: ${response.razorpay_payment_id}`,
              "success",
            );
            setTimeout(refreshBalance, 2500);
          },
          modal: {
            ondismiss: function () {
              showMessage("Payment window closed.", "error");
            },
          },
        });

        checkout.open();
      } catch (err) {
        showMessage(`Payment could not start: ${err.message || err}`, "error");
      } finally {
        setBusy(false);
      }
    }

    async function logout() {
      await client.auth.signOut();
      session = null;
      operator = null;
      homeView.classList.add("hidden");
      loginView.classList.remove("hidden");
      clearMessage();
    }

    loginBtn.addEventListener("click", login);
    buyBtn.addEventListener("click", buyCredits);
    refreshBtn.addEventListener("click", refreshBalance);
    logoutBtn.addEventListener("click", logout);

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        amountInput.value = chip.dataset.amount;
        updateCreditPreview();
      });
    });

    amountInput.addEventListener("input", updateCreditPreview);
    updateCreditPreview();

    client.auth.getSession().then(async ({ data }) => {
      session = data.session;

      if (!session) return;

      try {
        await loadOperator();
      } catch (_) {
        await client.auth.signOut();
      }
    });
  </script>
</body>
</html>
